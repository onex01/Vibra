name: Release

# Автоматический релиз.
#
# Триггеры:
#   * push в main — если версия в kernel/src/version.rs новая (тега ещё нет),
#     релиз собирается и публикуется сам. Хочешь собрать без релиза —
#     добавь в сообщение коммита `[skip release]`;
#   * push тега `v*` — пересборка/перезаливка существующего релиза;
#   * workflow_dispatch — вручную, с любым тегом.
#
# Тег создаётся внутри этого же workflow (job `publish`), а не отдельным
# пушем: тег, отправленный с GITHUB_TOKEN, не запускает другие workflow,
# поэтому публикация делается сразу здесь.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (по умолчанию v<версия из version.rs>)"
        required: false
      force:
        description: "Пересобрать даже если релиз уже существует"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Решает, нужен ли релиз, и вычисляет версию/тег один раз для всех job'ов.
  prepare:
    name: Resolve version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.vars.outputs.version }}
      codename: ${{ steps.vars.outputs.codename }}
      tag: ${{ steps.vars.outputs.tag }}
      should_release: ${{ steps.vars.outputs.should_release }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version, tag and release policy
        id: vars
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pub const KERNEL_VERSION: &str = "\(.*\)";/\1/p' kernel/src/version.rs)"
          codename="$(sed -n 's/^pub const KERNEL_CODENAME: &str = "\(.*\)";/\1/p' kernel/src/version.rs)"
          [[ -n "$version" ]] || { echo "cannot read KERNEL_VERSION" >&2; exit 1; }

          tag="${{ github.event.inputs.tag }}"
          [[ -n "$tag" ]] || tag="v$version"

          # rc/beta/alpha — предварительный релиз.
          prerelease=false
          case "$version" in
            *-rc.*|*-beta.*|*-alpha.*) prerelease=true ;;
          esac

          # Политика:
          #   тег      — всегда собираем (перезаливка разрешена);
          #   dispatch — всегда собираем;
          #   main     — только если такого тега ещё нет и нет `[skip release]`.
          should_release=true
          case "${{ github.event_name }}" in
            push)
              if [[ "${{ github.ref_type }}" != "tag" ]]; then
                if grep -qF '[skip release]' <<< "${{ github.event.head_commit.message }}"; then
                  echo "release skipped: [skip release] in the commit message"
                  should_release=false
                elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                  echo "release skipped: tag $tag already exists"
                  should_release=false
                fi
              fi
              ;;
          esac
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            should_release=true
          fi

          {
            echo "version=$version"
            echo "codename=$codename"
            echo "tag=$tag"
            echo "should_release=$should_release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag release=$should_release prerelease=$prerelease"

  build:
    name: Build images and notes
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.ci/rustup
      SMOKE_TIMEOUT: 180
      SMOKE_MIN_HEARTBEATS: 12
      BOOT_READY_TIMEOUT: 120
      DEBUG_IMAGE_TIMEOUT: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make qemu-system-x86 seabios mtools dosfstools wget tar xz-utils \
            xorriso fdisk ntfs-3g e2fsprogs gcc python3

      - name: Install Rust toolchain (rustup)
        run: |
          set -euo pipefail
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add x86_64-unknown-none --toolchain nightly
          cargo +nightly -V

      - name: Check build environment
        run: ./build.sh doctor

      - name: Create boot image
        run: ./build.sh setup

      - name: Check warning budgets
        run: python3 scripts/check-warning-budget.py

      - name: Build kernel
        run: make build

      - name: Smoke-test UEFI boot
        run: ./build.sh smoke

      - name: Test filesystem drivers
        run: ./build.sh fs-test

      - name: Build images
        run: |
          set -euo pipefail
          # Релизный ISO (UEFI+BIOS, без UART).
          ./build.sh iso-release
          # Отладочный ISO: serial-лог + раздел VIBRALOG.
          make iso-debug
          # GPT/ESP-образ для UEFI-флешки и MBR-образ для BIOS/CSM.
          ./build.sh uefi-usb
          ./build.sh usb
          # Флешка с тремя разделами (ESP, VIBRA, VIBRALOG).
          make usb-debug

      - name: Smoke-test the debug images
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          date="$(date -u +%Y-%m-%d)"
          bash scripts/qemu-debug-image-test.sh "build/vibra-usb-debug_${date}_${version}.img"
          bash scripts/qemu-debug-image-test.sh "build/vibra-debug_${date}_${version}.iso"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          # Только файлы этой версии: build/ содержит ещё образы тестов
          # (fs-test, iso-test) и symlink'и vibra.iso/vibra-debug.iso.
          find build -maxdepth 1 -type f -name "*_${version}.*" -exec cp {} dist/ \;
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            find build -maxdepth 1 -type f -name "*_${version}.*" -print
          fi
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && sha256sum * > SHA256SUMS && ls -lh)

      - name: Write manifest
        run: |
          set -euo pipefail
          {
            echo "version=${{ needs.prepare.outputs.version }}"
            echo "codename=${{ needs.prepare.outputs.codename }}"
            echo "tag=${{ needs.prepare.outputs.tag }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "commit_short=$(git rev-parse --short HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rustc=$(cargo +nightly -V 2>/dev/null || echo unknown)"
            echo "limine=$(grep -m1 '^LIMINE_VERSION' Makefile 2>/dev/null || true)"
            echo "ovmf=$(sha256sum OVMF.fd 2>/dev/null | cut -d' ' -f1 || echo unknown)"
          } > dist/MANIFEST.txt
          cat dist/MANIFEST.txt

      - name: Generate release notes
        run: |
          set -euo pipefail
          scripts/release-notes.sh \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --dist dist \
            --out dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibra-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: build/*.log
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: vibra-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"

          # Тег мог не существовать (сборка по push в main) — создаём его
          # здесь же: пуш тега через GITHUB_TOKEN не запускает workflow
          # повторно, поэтому публикацию делаем сразу.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Vibra $version «${{ needs.prepare.outputs.codename }}»"
            git push origin "refs/tags/$tag"
          fi

          args=(--title "Vibra $version «${{ needs.prepare.outputs.codename }}»"
                --notes-file dist/RELEASE_NOTES.md)
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" "${args[@]}"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* "${args[@]}"
          fi

          gh release view "$tag" --json url,tagName,assets \
            --jq '"published \(.tagName): \(.url)\n" + (.assets[] | "  - \(.name) (\(.size) bytes)")'
