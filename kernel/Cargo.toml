[package]
name = "vibra-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
limine = "0.6"
spin = "0.9.8"

[features]
default = ["serial-debug"]
serial-debug = []

[lib]
name = "vibra_kernel"
path = "src/lib.rs"

[[bin]]
name = "vibra"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
