[package]
name = "vibra-kernel"
version = "0.2.0-rc.1"
edition = "2021"

[dependencies]
limine = "0.6"
spin = "0.9.8"

[features]
default = ["serial-debug"]
serial-debug = []
# Включает raw-запись boot-лога в LBA 2/3 первого SATA-порта.
# ОПАСНО на реальном железе: на внутреннем SSD это GPT partition entries.
# Только для тестового носителя.
boot-log-to-disk = []

[lib]
name = "vibra_kernel"
path = "src/lib.rs"

[[bin]]
name = "vibra"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
